name: Contribution Test

on:
  push:
    branches: ["fix/gemini-error-response"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test Gemini error handling
        run: cargo +stable test --test single_provider google_preserves_unparseable_error_status
      - name: Check formatting
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo +stable ci-clippy
